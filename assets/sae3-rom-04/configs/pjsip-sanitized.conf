; Extrait assaini inspiré des configurations PJSIP du TP ToIP.
; Les mots de passe, adresses IP privées et identifiants matériels ont été masqués.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[FanvilXX]
type=endpoint
context=interne
disallow=all
allow=ulaw
direct_media=no
auth=FanvilXX-auth
aors=FanvilXX

[FanvilXX-auth]
type=auth
auth_type=userpass
username=FanvilXX
password=<mot-de-passe-masque>

[FanvilXX]
type=aor
max_contacts=1
remove_existing=yes

[CiscoXX]
type=endpoint
context=interne
disallow=all
allow=ulaw
direct_media=no
auth=CiscoXX-auth
aors=CiscoXX

[CiscoXX-auth]
type=auth
auth_type=userpass
username=CiscoXX
password=<mot-de-passe-masque>

[CiscoXX]
type=aor
max_contacts=1
remove_existing=yes
