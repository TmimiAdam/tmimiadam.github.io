; Extrait assaini du transport TLS PJSIP.
; Les chemins de certificats sont conservés à titre d'architecture, pas comme clés publiées.

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=<chemin-certificat-non-publie>
priv_key_file=<chemin-cle-privee-non-publie>
method=tlsv1_2
verify_client=no
verify_server=no
tls_disable=0
allow_reload=yes

; Bonnes pratiques associées dans le TP :
; - direct_media=no
; - remove_existing=yes
; - identify par adresse contrôlée
; - mots de passe SIP non publiés
